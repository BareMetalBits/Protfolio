name: Keep Streamlit Alive

# ─── SCHEDULE ─────────────────────────────────────────────────────────────────
# Runs every 10 minutes using a real headless browser.
# If the app is sleeping, it clicks "Yes, get this app back up!" automatically.
#
# ─── TOGGLE ON / OFF ──────────────────────────────────────────────────────────
#   GitHub repo → Actions tab → "Keep Streamlit Alive" → ⋯ → Disable / Enable
#   Or trigger a one-off run with the "Run workflow" button.
#
# ─── PRIVATE REPO NOTE ────────────────────────────────────────────────────────
#   Public repos  → GitHub Actions minutes are UNLIMITED  (10 min interval OK)
#   Private repos → 2 000 free min/month; change cron to "*/30 * * * *" instead
# ──────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:          # manual "Run workflow" button

jobs:
  wake:
    name: Wake / Keep Alive
    runs-on: ubuntu-latest

    steps:
      # ── 1. Python ────────────────────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 2. Cache Playwright's Chromium binary (~280 MB) ───────────────────
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      # ── 3. Install Playwright (fast after first run due to cache) ─────────
      - name: Install Playwright + Chromium
        run: |
          pip install playwright --quiet
          playwright install chromium --with-deps

      # ── 4. Checkout repo so wake_app.py is available ──────────────────────
      - uses: actions/checkout@v4

      # ── 5. Run the wake script ────────────────────────────────────────────
      - name: Wake Streamlit app
        run: python wake_app.py